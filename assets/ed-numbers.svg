<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="70" viewBox="0 0 1000 70" role="img" aria-label="BY THE NUMBERS">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.2  0 0 0 0.06 0"/>
  </filter>
</defs>
<rect width="1000" height="70" fill="#F4EFE6"/>
<rect width="1000" height="70" filter="url(#grain)"/>
<text x="40" y="40" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#B3261E" text-anchor="start" letter-spacing="2" >BY THE NUMBERS</text>
<text x="960" y="40" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#6B6257" text-anchor="end" letter-spacing="2" >FROM GITHUB, UPDATED LIVE</text>
<line x1="40" y1="54" x2="960" y2="54" stroke="#1A1714" stroke-width="1.5"/>
</svg>
