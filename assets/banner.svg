<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#0E1626" />
    </linearGradient>

    <!-- Animated Text Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#C084FC;#38BDF8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#C084FC;#38BDF8;#818CF8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#C084FC">
        <animate attributeName="stop-color" values="#C084FC;#38BDF8;#818CF8;#C084FC" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.9" />
    </linearGradient>

    <!-- Radar / Scanline Beam Gradient -->
    <linearGradient id="scanbeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="glowLeft" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25">
        <animate attributeName="stop-opacity" values="0.25;0.12;0.25" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.22">
        <animate attributeName="stop-opacity" values="0.15;0.30;0.15" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45" />
    </pattern>

    <!-- Neon Circuit Paths for Packet Animation -->
    <path id="circuitPath1" d="M 920 105 L 1020 105 L 1070 155 L 1150 155" fill="none" />
    <path id="circuitPath2" d="M 960 185 L 1040 185 L 1080 225 L 1150 225" fill="none" />
    <path id="circuitPath3" d="M 890 270 L 980 270 L 1030 310 L 1140 310" fill="none" />
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-weight: 800;
      font-size: 52px;
      letter-spacing: -0.5px;
    }
    .role-badge-text {
      font-family: 'SF Mono', Monaco, Consolas, 'Courier New', monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #38BDF8;
    }
    .subtext {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-size: 17px;
      font-weight: 400;
      fill: #94A3B8;
    }
    .status-text {
      font-family: 'SF Mono', Monaco, Consolas, 'Courier New', monospace;
      font-size: 12px;
      font-weight: 500;
      fill: #CBD5E1;
    }
    .cursor-blink {
      animation: blink 1s step-end infinite;
    }
    .badge-glow {
      animation: badgeGlow 3s ease-in-out infinite alternate;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes badgeGlow {
      0% { stroke: #38BDF8; stroke-opacity: 0.3; }
      100% { stroke: #818CF8; stroke-opacity: 0.8; }
    }
  </style>

  <!-- Container Box with Rounded Corners -->
  <rect x="2" y="2" width="1196" height="346" rx="16" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="1.5" />

  <!-- Background Grid & Glows -->
  <rect x="4" y="4" width="1192" height="342" rx="14" fill="url(#grid)" />
  <rect x="4" y="4" width="1192" height="342" rx="14" fill="url(#glowLeft)" />
  <rect x="4" y="4" width="1192" height="342" rx="14" fill="url(#glowRight)" />

  <!-- Animated Laser Scanline moving down -->
  <rect x="4" y="46" width="1192" height="60" fill="url(#scanbeam)">
    <animate attributeName="y" values="46;280;46" dur="8s" repeatCount="indefinite" />
  </rect>

  <!-- Window Chrome Header Bar -->
  <rect x="4" y="4" width="1192" height="42" rx="14" fill="#0E1626" fill-opacity="0.9" />
  <line x1="4" y1="46" x2="1196" y2="46" stroke="#1E293B" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="34" cy="25" r="6" fill="#EF4444" />
  <circle cx="54" cy="25" r="6" fill="#F59E0B" />
  <circle cx="74" cy="25" r="6" fill="#10B981" />

  <!-- Terminal Title with blinking cursor -->
  <text x="50%" y="28" text-anchor="middle" class="status-text" fill="#64748B">
    vijender@kernel: ~ /portfolio (v2.5.0)<tspan fill="#38BDF8" class="cursor-blink">_</tspan>
  </text>

  <!-- Live Status Chip in Header -->
  <g transform="translate(1015, 14)">
    <rect x="0" y="0" width="150" height="22" rx="11" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="14" cy="11" r="4" fill="#10B981">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5;4.5;3.5" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="15" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="600" fill="#34D399">SYSTEM ACTIVE</text>
  </g>

  <!-- Circuit Traces (Static lines) -->
  <g stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.5" fill="none">
    <use href="#circuitPath1" />
    <use href="#circuitPath2" />
    <use href="#circuitPath3" />
    <circle cx="1150" cy="155" r="4" fill="#38BDF8" fill-opacity="0.6" />
    <circle cx="1150" cy="225" r="4" fill="#818CF8" fill-opacity="0.6" />
    <circle cx="1140" cy="310" r="4" fill="#C084FC" fill-opacity="0.6" />
  </g>

  <!-- Animated Data Packets Traveling on Circuits -->
  <circle r="3.5" fill="#38BDF8">
    <animateMotion dur="2.5s" repeatCount="indefinite">
      <mpath href="#circuitPath1" />
    </animateMotion>
  </circle>
  <circle r="3" fill="#818CF8">
    <animateMotion dur="3.2s" repeatCount="indefinite">
      <mpath href="#circuitPath2" />
    </animateMotion>
  </circle>
  <circle r="3" fill="#C084FC">
    <animateMotion dur="2.8s" repeatCount="indefinite">
      <mpath href="#circuitPath3" />
    </animateMotion>
  </circle>

  <!-- Sub-Badge Category -->
  <g transform="translate(56, 92)">
    <rect x="0" y="0" width="370" height="26" rx="6" fill="#38BDF8" fill-opacity="0.08" class="badge-glow" stroke-width="1" />
    <text x="14" y="18" class="role-badge-text">⚡ FULL STACK • WEB3 • AI / VOICE</text>
  </g>

  <!-- Main Hero Title with Dynamic Gradient -->
  <text x="56" y="174" class="title" fill="url(#textGradient)">VIJENDER YADAV</text>

  <!-- Descriptive Subtitle -->
  <text x="56" y="214" class="subtext">
    Engineering resilient web architectures, decentralized protocols, and intelligent voice systems.
  </text>
  <text x="56" y="240" class="subtext" font-size="15" fill="#64748B">
    Building high-performance systems with clarity, precision, and modern engineering standards.
  </text>

  <!-- Quick Info Highlights Footer in Banner -->
  <g transform="translate(56, 282)">
    <!-- Pill 1: Internship -->
    <rect x="0" y="0" width="225" height="30" rx="8" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="14" y="20" class="status-text" fill="#94A3B8">💼 <tspan fill="#F8FAFC" font-weight="600">Full Stack Intern</tspan> @ HobbyFi</text>

    <!-- Pill 2: Web3 -->
    <rect x="240" y="0" width="195" height="30" rx="8" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="254" y="20" class="status-text" fill="#94A3B8">⛓️ <tspan fill="#F8FAFC" font-weight="600">EVM &amp; Solana</tspan> Builder</text>

    <!-- Pill 3: Location -->
    <rect x="450" y="0" width="125" height="30" rx="8" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <text x="464" y="20" class="status-text" fill="#94A3B8">📍 <tspan fill="#F8FAFC" font-weight="600">India</tspan></text>
  </g>
</svg>
