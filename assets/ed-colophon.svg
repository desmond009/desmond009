<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-label="Letters to the editor">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.2  0 0 0 0.06 0"/>
  </filter>
</defs>
<rect width="1000" height="190" fill="#F4EFE6"/>
<rect width="1000" height="190" filter="url(#grain)"/>
<line x1="40" y1="30" x2="960" y2="30" stroke="#1A1714" stroke-width="2.5"/>
<text x="40" y="64" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#B3261E" text-anchor="start" letter-spacing="2" >LETTERS TO THE EDITOR</text>
<text x="40" y="112" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Charter, Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" font-style="normal" fill="#1A1714" text-anchor="start" letter-spacing="0" >Working on payments, fraud, AI agents or Web3?</text>
<text x="40" y="146" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Charter, Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" font-style="italic" fill="#6B6257" text-anchor="start" letter-spacing="0" >Write in. The links are just below.</text>
<line x1="40" y1="170" x2="960" y2="170" stroke="#1A1714" stroke-width="2.5"/>
</svg>
