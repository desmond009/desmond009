<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" width="100%" height="100%">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#080D1A" />
    </linearGradient>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080D1A" />
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="borderCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="borderEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="borderViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="borderRose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3" />
    </linearGradient>

    <!-- Hover & Glow Filters -->
    <filter id="cyanGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    .card {
      transition: transform 0.25s ease, filter 0.25s ease;
      cursor: pointer;
    }
    .card:hover {
      filter: url(#cyanGlow);
    }
    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
      font-weight: 700;
      font-size: 19px;
      fill: #F1F5F9;
      letter-spacing: -0.2px;
    }
    .card-badge {
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .card-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
      font-size: 13.5px;
      font-weight: 400;
      fill: #94A3B8;
      line-height: 1.4;
    }
    .tag-text {
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 500;
    }
    .arrow-icon {
      fill: #64748B;
      transition: fill 0.2s ease, transform 0.2s ease;
    }
    .card:hover .arrow-icon {
      fill: #38BDF8;
      transform: translate(2px, -2px);
    }
    .pulse-dot {
      animation: pulseAnim 2s infinite ease-in-out;
    }
    @keyframes pulseAnim {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>

  <!-- ================= CARD 1: HOBBYFI ================= -->
  <a href="https://github.com/desmond009" target="_blank">
    <g class="card" transform="translate(10, 15)">
      <!-- Background Card -->
      <rect width="525" height="195" rx="14" fill="url(#cardBg1)" stroke="#1E293B" stroke-width="1.2" />
      <path d="M 0 14 Q 0 0 14 0 L 140 0 L 0 140 Z" fill="#38BDF8" fill-opacity="0.04" />
      <!-- Left Accent Bar -->
      <rect x="0" y="14" width="4" height="167" rx="2" fill="#38BDF8" />
      
      <!-- Icon & Title -->
      <g transform="translate(24, 32)">
        <circle cx="12" cy="12" r="14" fill="#38BDF8" fill-opacity="0.12" />
        <text x="7" y="18" font-size="14">💼</text>
        <text x="36" y="18" class="card-title">HobbyFi</text>
        <!-- Arrow Link -->
        <path class="arrow-icon" transform="translate(125, 6)" d="M1 9L8 2M8 2H2M8 2V8" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>

      <!-- Status Badge -->
      <g transform="translate(365, 26)">
        <rect width="138" height="24" rx="12" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.35" stroke-width="1" />
        <circle cx="14" cy="12" r="4" fill="#10B981" class="pulse-dot" />
        <text x="24" y="16" class="card-badge" fill="#34D399">ACTIVE DEV</text>
      </g>

      <!-- Description -->
      <text x="26" y="86" class="card-desc">
        <tspan fill="#E2E8F0" font-weight="600">Full Stack Developer Intern</tspan> — Building responsive, modern
      </text>
      <text x="26" y="108" class="card-desc">
        web and mobile UI interfaces with scalable backend API integrations.
      </text>

      <!-- Stack Pills -->
      <g transform="translate(26, 142)">
        <!-- Pill 1 -->
        <rect width="64" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="32" y="16" text-anchor="middle" class="tag-text" fill="#38BDF8">React</text>
        <!-- Pill 2 -->
        <rect x="74" width="70" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="109" y="16" text-anchor="middle" class="tag-text" fill="#34D399">Node.js</text>
        <!-- Pill 3 -->
        <rect x="154" width="88" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="198" y="16" text-anchor="middle" class="tag-text" fill="#60A5FA">TypeScript</text>
        <!-- Pill 4 -->
        <rect x="252" width="50" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="277" y="16" text-anchor="middle" class="tag-text" fill="#F472B6">C++</text>
        <!-- Pill 5 -->
        <rect x="312" width="78" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="351" y="16" text-anchor="middle" class="tag-text" fill="#CBD5E1">REST APIs</text>
      </g>
    </g>
  </a>

  <!-- ================= CARD 2: MINILINK ================= -->
  <a href="https://minilink-phi.vercel.app" target="_blank">
    <g class="card" transform="translate(560, 15)">
      <!-- Background Card -->
      <rect width="525" height="195" rx="14" fill="url(#cardBg2)" stroke="#1E293B" stroke-width="1.2" />
      <path d="M 0 14 Q 0 0 14 0 L 140 0 L 0 140 Z" fill="#34D399" fill-opacity="0.04" />
      <!-- Left Accent Bar -->
      <rect x="0" y="14" width="4" height="167" rx="2" fill="#34D399" />
      
      <!-- Icon & Title -->
      <g transform="translate(24, 32)">
        <circle cx="12" cy="12" r="14" fill="#34D399" fill-opacity="0.12" />
        <text x="7" y="18" font-size="14">🔗</text>
        <text x="36" y="18" class="card-title">Minilink</text>
        <!-- Arrow Link -->
        <path class="arrow-icon" transform="translate(118, 6)" d="M1 9L8 2M8 2H2M8 2V8" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>

      <!-- Status Badge -->
      <g transform="translate(365, 26)">
        <rect width="138" height="24" rx="12" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1" />
        <circle cx="14" cy="12" r="4" fill="#38BDF8" class="pulse-dot" />
        <text x="24" y="16" class="card-badge" fill="#38BDF8">PRODUCTION</text>
      </g>

      <!-- Description -->
      <text x="26" y="86" class="card-desc">
        <tspan fill="#E2E8F0" font-weight="600">High-Performance URL Engine</tspan> — Sub-millisecond routing,
      </text>
      <text x="26" y="108" class="card-desc">
        real-time click telemetry, custom slugs &amp; analytics dashboard.
      </text>

      <!-- Stack Pills -->
      <g transform="translate(26, 142)">
        <rect width="68" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="34" y="16" text-anchor="middle" class="tag-text" fill="#F8FAFC">Next.js</text>

        <rect x="78" width="70" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="113" y="16" text-anchor="middle" class="tag-text" fill="#34D399">Node.js</text>

        <rect x="158" width="80" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="198" y="16" text-anchor="middle" class="tag-text" fill="#4ADE80">MongoDB</text>

        <rect x="248" width="78" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="287" y="16" text-anchor="middle" class="tag-text" fill="#38BDF8">Express</text>

        <rect x="336" width="75" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="373" y="16" text-anchor="middle" class="tag-text" fill="#22D3EE">Tailwind</text>
      </g>
    </g>
  </a>

  <!-- ================= CARD 3: ORCAEARN ================= -->
  <a href="https://staking-contract-orca.vercel.app" target="_blank">
    <g class="card" transform="translate(10, 235)">
      <!-- Background Card -->
      <rect width="525" height="195" rx="14" fill="url(#cardBg1)" stroke="#1E293B" stroke-width="1.2" />
      <path d="M 0 14 Q 0 0 14 0 L 140 0 L 0 140 Z" fill="#818CF8" fill-opacity="0.04" />
      <!-- Left Accent Bar -->
      <rect x="0" y="14" width="4" height="167" rx="2" fill="#818CF8" />
      
      <!-- Icon & Title -->
      <g transform="translate(24, 32)">
        <circle cx="12" cy="12" r="14" fill="#818CF8" fill-opacity="0.12" />
        <text x="7" y="18" font-size="14">🌊</text>
        <text x="36" y="18" class="card-title">OrcaEarn</text>
        <!-- Arrow Link -->
        <path class="arrow-icon" transform="translate(130, 6)" d="M1 9L8 2M8 2H2M8 2V8" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>

      <!-- Status Badge -->
      <g transform="translate(365, 26)">
        <rect width="138" height="24" rx="12" fill="#818CF8" fill-opacity="0.1" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1" />
        <circle cx="14" cy="12" r="4" fill="#818CF8" class="pulse-dot" />
        <text x="24" y="16" class="card-badge" fill="#A5B4FC">DEPLOYED</text>
      </g>

      <!-- Description -->
      <text x="26" y="86" class="card-desc">
        <tspan fill="#E2E8F0" font-weight="600">DeFi Staking Protocol</tspan> — Decentralized asset locking,
      </text>
      <text x="26" y="108" class="card-desc">
        custom yield-accrual smart contracts on EVM &amp; Web3 dApp portal.
      </text>

      <!-- Stack Pills -->
      <g transform="translate(26, 142)">
        <rect width="70" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="35" y="16" text-anchor="middle" class="tag-text" fill="#A5B4FC">Solidity</text>

        <rect x="80" width="76" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="118" y="16" text-anchor="middle" class="tag-text" fill="#818CF8">Ethers.js</text>

        <rect x="166" width="60" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="196" y="16" text-anchor="middle" class="tag-text" fill="#38BDF8">React</text>

        <rect x="236" width="64" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="268" y="16" text-anchor="middle" class="tag-text" fill="#FBBF24">Hardhat</text>

        <rect x="310" width="56" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="338" y="16" text-anchor="middle" class="tag-text" fill="#F472B6">Web3</text>
      </g>
    </g>
  </a>

  <!-- ================= CARD 4: VOICE AI & INTELLIGENCE ================= -->
  <a href="https://github.com/desmond009" target="_blank">
    <g class="card" transform="translate(560, 235)">
      <!-- Background Card -->
      <rect width="525" height="195" rx="14" fill="url(#cardBg2)" stroke="#1E293B" stroke-width="1.2" />
      <path d="M 0 14 Q 0 0 14 0 L 140 0 L 0 140 Z" fill="#F43F5E" fill-opacity="0.04" />
      <!-- Left Accent Bar -->
      <rect x="0" y="14" width="4" height="167" rx="2" fill="#F43F5E" />
      
      <!-- Icon & Title -->
      <g transform="translate(24, 32)">
        <circle cx="12" cy="12" r="14" fill="#F43F5E" fill-opacity="0.12" />
        <text x="7" y="18" font-size="14">🎙️</text>
        <text x="36" y="18" class="card-title">AI &amp; Voice Systems</text>
        <!-- Arrow Link -->
        <path class="arrow-icon" transform="translate(225, 6)" d="M1 9L8 2M8 2H2M8 2V8" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>

      <!-- Status Badge -->
      <g transform="translate(365, 26)">
        <rect width="138" height="24" rx="12" fill="#F59E0B" fill-opacity="0.1" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1" />
        <circle cx="14" cy="12" r="4" fill="#F59E0B" class="pulse-dot" />
        <text x="24" y="16" class="card-badge" fill="#FBBF24">PROTOTYPING</text>
      </g>

      <!-- Description -->
      <text x="26" y="86" class="card-desc">
        <tspan fill="#E2E8F0" font-weight="600">Intelligent Real-Time Audio</tspan> — Low-latency voice pipelines,
      </text>
      <text x="26" y="108" class="card-desc">
        streaming LLM orchestration, and AI spatial safety verification.
      </text>

      <!-- Stack Pills -->
      <g transform="translate(26, 142)">
        <rect width="66" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="33" y="16" text-anchor="middle" class="tag-text" fill="#60A5FA">Python</text>

        <rect x="76" width="74" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="113" y="16" text-anchor="middle" class="tag-text" fill="#F43F5E">Voice AI</text>

        <rect x="160" width="105" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="212" y="16" text-anchor="middle" class="tag-text" fill="#A78BFA">WebSockets</text>

        <rect x="275" width="70" height="24" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="310" y="16" text-anchor="middle" class="tag-text" fill="#34D399">LLM Ops</text>
      </g>
    </g>
  </a>
</svg>
