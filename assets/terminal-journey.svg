<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="100%" height="100%">
  <defs>
    <!-- Terminal Window Gradients -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.9" />
    </linearGradient>

    <filter id="subtleGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .term-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, Monaco, monospace;
      font-size: 13.5px;
      line-height: 1.6;
    }
    .term-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #64748B;
    }
    .cursor-blink {
      animation: blinkCursor 1s step-end infinite;
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Window Container with Outer Shadow -->
  <rect x="2" y="2" width="996" height="366" rx="12" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.2" filter="url(#subtleGlow)" />

  <!-- Terminal Title Bar -->
  <rect x="2" y="2" width="996" height="38" rx="12" fill="#0E1626" fill-opacity="0.95" />
  <rect x="2" y="26" width="996" height="14" fill="#0E1626" fill-opacity="0.95" />
  <line x1="2" y1="40" x2="998" y2="40" stroke="#1E293B" stroke-width="1" />

  <!-- macOS Window Controls -->
  <circle cx="24" cy="21" r="5.5" fill="#EF4444" />
  <circle cx="42" cy="21" r="5.5" fill="#F59E0B" />
  <circle cx="60" cy="21" r="5.5" fill="#10B981" />

  <!-- Title in Header Bar -->
  <text x="500" y="25" text-anchor="middle" class="term-title">zsh — vijender@dev-kernel: ~/journey — 88x16</text>

  <!-- Branch / Environment Indicator on Right of Title Bar -->
  <g transform="translate(865, 12)">
    <rect width="112" height="18" rx="4" fill="#1E293B" fill-opacity="0.8" />
    <text x="56" y="13" text-anchor="middle" font-family="'SF Mono', monospace" font-size="10.5" fill="#94A3B8">git:(main)⚡</text>
  </g>

  <!-- ================= TERMINAL CONTENT ================= -->

  <!-- Command Line 1 -->
  <g transform="translate(30, 70)" class="term-text">
    <text x="0" y="0">
      <tspan fill="#34D399" font-weight="700">vijender@dev-kernel</tspan>
      <tspan fill="#64748B">:</tspan>
      <tspan fill="#38BDF8" font-weight="600">~/journey</tspan>
      <tspan fill="#94A3B8">$</tspan>
      <tspan fill="#F8FAFC"> git log --graph --date=short --pretty=format:</tspan>
      <tspan fill="#FBBF24">"%h %ad %s"</tspan>
    </text>
  </g>

  <!-- Git Graph Node 1 (2026 - Present) -->
  <g transform="translate(30, 108)" class="term-text">
    <text x="0" y="0">
      <tspan fill="#38BDF8" font-weight="700">*</tspan>
      <tspan fill="#38BDF8" font-weight="600"> c8f92a1 </tspan>
      <tspan fill="#FBBF24" font-weight="600">[2026-PRESENT]</tspan>
      <tspan fill="#34D399"> (HEAD -&gt; </tspan>
      <tspan fill="#38BDF8" font-weight="600">main</tspan>
      <tspan fill="#34D399">, </tspan>
      <tspan fill="#F472B6">tag: v4.0-intern</tspan>
      <tspan fill="#34D399">)</tspan>
      <tspan fill="#F8FAFC" font-weight="700"> Full Stack Developer Intern @ HobbyFi</tspan>
    </text>
    <text x="0" y="24">
      <tspan fill="#38BDF8">|</tspan>
      <tspan fill="#64748B">  └── </tspan>
      <tspan fill="#94A3B8">Architecting core web/mobile features, interactive components &amp; high-throughput APIs</tspan>
    </text>
  </g>

  <!-- Git Graph Node 2 (2025) -->
  <g transform="translate(30, 168)" class="term-text">
    <text x="0" y="0">
      <tspan fill="#818CF8" font-weight="700">*</tspan>
      <tspan fill="#818CF8" font-weight="600"> 7d3e0b4 </tspan>
      <tspan fill="#FBBF24" font-weight="600">[2025]</tspan>
      <tspan fill="#F472B6"> (tag: v3.0-web3)</tspan>
      <tspan fill="#F8FAFC" font-weight="700"> Web3 &amp; DeFi Ecosystem Architecture</tspan>
    </text>
    <text x="0" y="24">
      <tspan fill="#818CF8">|</tspan>
      <tspan fill="#64748B">  └── </tspan>
      <tspan fill="#94A3B8">Engineered EVM staking dApps (OrcaEarn) &amp; Solana testnet RPC portals (Sol_Faucet)</tspan>
    </text>
  </g>

  <!-- Git Graph Node 3 (2024) -->
  <g transform="translate(30, 228)" class="term-text">
    <text x="0" y="0">
      <tspan fill="#34D399" font-weight="700">*</tspan>
      <tspan fill="#34D399" font-weight="600"> 4a821e9 </tspan>
      <tspan fill="#FBBF24" font-weight="600">[2024]</tspan>
      <tspan fill="#F472B6"> (tag: v2.0-fullstack)</tspan>
      <tspan fill="#F8FAFC" font-weight="700"> Scalable Full Stack Web Applications</tspan>
    </text>
    <text x="0" y="24">
      <tspan fill="#34D399">|</tspan>
      <tspan fill="#64748B">  └── </tspan>
      <tspan fill="#94A3B8">Shipped production web engines (Minilink, SoulScript), MongoDB schemas &amp; queue services</tspan>
    </text>
  </g>

  <!-- Git Graph Node 4 (2023 - Genesis) -->
  <g transform="translate(30, 288)" class="term-text">
    <text x="0" y="0">
      <tspan fill="#F59E0B" font-weight="700">*</tspan>
      <tspan fill="#F59E0B" font-weight="600"> 109ac32 </tspan>
      <tspan fill="#FBBF24" font-weight="600">[2023]</tspan>
      <tspan fill="#F472B6"> (tag: v1.0-genesis)</tspan>
      <tspan fill="#F8FAFC" font-weight="700"> Computer Science Core &amp; Algorithmic Foundations</tspan>
    </text>
    <text x="0" y="24">
      <tspan fill="#64748B">   └── </tspan>
      <tspan fill="#94A3B8">Mastered Data Structures &amp; C++ algorithms; solved 300+ problems on LeetCode &amp; GFG</tspan>
    </text>
  </g>

  <!-- Bottom Prompt with Active Blinking Cursor -->
  <g transform="translate(30, 342)" class="term-text">
    <text x="0" y="0">
      <tspan fill="#34D399" font-weight="700">vijender@dev-kernel</tspan>
      <tspan fill="#64748B">:</tspan>
      <tspan fill="#38BDF8" font-weight="600">~/journey</tspan>
      <tspan fill="#94A3B8">$</tspan>
      <tspan fill="#F8FAFC"> status --all</tspan>
      <tspan fill="#38BDF8" class="cursor-blink"> █</tspan>
    </text>
  </g>
</svg>
