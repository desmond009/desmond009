<svg xmlns="http://www.w3.org/2000/svg" width="490" height="430" viewBox="0 0 490 430" role="img" aria-label="Six nodes, one fraud investigation">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.2  0 0 0 0.06 0"/>
  </filter>
</defs>
<rect width="490" height="430" fill="#F4EFE6"/>
<rect width="490" height="430" filter="url(#grain)"/>
<text x="30" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#B3261E" text-anchor="start" letter-spacing="2" >AGENTIC AI</text>
<text x="460" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#6B6257" text-anchor="end" letter-spacing="2" >PAGE 02</text>
<line x1="30" y1="58" x2="460" y2="58" stroke="#1A1714" stroke-width="1.5"/>
<text x="30" y="104" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Charter, Georgia, 'Times New Roman', serif" font-size="31" font-weight="700" font-style="normal" fill="#1A1714" text-anchor="start" letter-spacing="0" >Six nodes, one fraud</text>
<text x="30" y="141" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Charter, Georgia, 'Times New Roman', serif" font-size="31" font-weight="700" font-style="normal" fill="#1A1714" text-anchor="start" letter-spacing="0" >investigation</text>
<text x="30" y="179" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Charter, Georgia, 'Times New Roman', serif" font-size="16.5" font-weight="400" font-style="italic" fill="#1A1714" text-anchor="start" letter-spacing="0" >A LangGraph agent walks a TigerGraph network of</text>
<text x="30" y="204" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Charter, Georgia, 'Times New Roman', serif" font-size="16.5" font-weight="400" font-style="italic" fill="#1A1714" text-anchor="start" letter-spacing="0" >accounts, pulls context through GraphRAG and recommends</text>
<text x="30" y="229" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Charter, Georgia, 'Times New Roman', serif" font-size="16.5" font-weight="400" font-style="italic" fill="#1A1714" text-anchor="start" letter-spacing="0" >the next action to an analyst.</text>
<line x1="30" y1="268" x2="70" y2="268" stroke="#B3261E" stroke-width="3"/>
<text x="30" y="312" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Charter, Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" font-style="normal" fill="#B3261E" text-anchor="start" letter-spacing="-1" >20 / 20</text>
<text x="30" y="338" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Charter, Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" font-style="italic" fill="#6B6257" text-anchor="start" letter-spacing="0" >official benchmark cases evaluated</text>
<line x1="30" y1="384" x2="460" y2="384" stroke="#CFC5B4" stroke-width="1"/>
<text x="30" y="408" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6B6257" text-anchor="start" letter-spacing="0.2" >LangGraph · TigerGraph · ChromaDB · FastAPI · React 19</text>
