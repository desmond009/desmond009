<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="306" viewBox="0 0 1000 306" role="img" aria-label="~/.stack.toml — vim">
<defs>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity="0.018"/></pattern>
  
</defs>
<style>
  text { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .cur { animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
<rect x="0.5" y="0.5" width="999" height="305" rx="10" fill="#0A0E14" stroke="#1F2630"/>
<path d="M0.5 36 V10.5 a10 10 0 0 1 10 -10 H989.5 a10 10 0 0 1 10 10 V36 Z" fill="#11161D"/>
<line x1="0.5" y1="36" x2="999.5" y2="36" stroke="#1F2630"/>
<circle cx="20" cy="18" r="6" fill="#FF5F57"/><circle cx="40" cy="18" r="6" fill="#FEBC2E"/><circle cx="60" cy="18" r="6" fill="#28C840"/>
<text x="500.0" y="23" fill="#6E7681" font-size="12.5" text-anchor="middle">~/.stack.toml — vim</text>
<text x="32" y="70" font-size="15" xml:space="preserve" ><tspan fill="#4ADE80">➜ </tspan><tspan fill="#56D4DD">~ </tspan><tspan fill="#C9D1D9">cat ~/.stack.toml</tspan></text>
<text x="32" y="106" font-size="14.5" xml:space="preserve" ><tspan fill="#F5B841">languages  </tspan><tspan fill="#6E7681">= [ </tspan><tspan fill="#4ADE80">"typescript"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#56D4DD">"javascript"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#4ADE80">"python"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#56D4DD">"c++"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#4ADE80">"solidity"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#56D4DD">"java"</tspan><tspan fill="#6E7681"> ]</tspan></text>
<text x="32" y="134" font-size="14.5" xml:space="preserve" ><tspan fill="#F5B841">frontend   </tspan><tspan fill="#6E7681">= [ </tspan><tspan fill="#4ADE80">"react"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#56D4DD">"next.js"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#4ADE80">"tailwind"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#56D4DD">"vite"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#4ADE80">"redux"</tspan><tspan fill="#6E7681"> ]</tspan></text>
<text x="32" y="162" font-size="14.5" xml:space="preserve" ><tspan fill="#F5B841">backend    </tspan><tspan fill="#6E7681">= [ </tspan><tspan fill="#4ADE80">"node"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#56D4DD">"fastify"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#4ADE80">"express"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#56D4DD">"fastapi"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#4ADE80">"websockets"</tspan><tspan fill="#6E7681"> ]</tspan></text>
<text x="32" y="190" font-size="14.5" xml:space="preserve" ><tspan fill="#F5B841">data       </tspan><tspan fill="#6E7681">= [ </tspan><tspan fill="#4ADE80">"mongodb"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#56D4DD">"postgres"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#4ADE80">"redis"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#56D4DD">"sqlite"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#4ADE80">"chromadb"</tspan><tspan fill="#6E7681"> ]</tspan></text>
<text x="32" y="218" font-size="14.5" xml:space="preserve" ><tspan fill="#F5B841">ai         </tspan><tspan fill="#6E7681">= [ </tspan><tspan fill="#4ADE80">"langgraph"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#56D4DD">"graphrag"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#4ADE80">"llm agents"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#56D4DD">"ml pipelines"</tspan><tspan fill="#6E7681"> ]</tspan></text>
<text x="32" y="246" font-size="14.5" xml:space="preserve" ><tspan fill="#F5B841">web3       </tspan><tspan fill="#6E7681">= [ </tspan><tspan fill="#4ADE80">"hardhat"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#56D4DD">"ethers.js"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#4ADE80">"openzeppelin"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#56D4DD">"solana web3.js"</tspan><tspan fill="#6E7681"> ]</tspan></text>
<text x="32" y="274" font-size="14.5" xml:space="preserve" ><tspan fill="#F5B841">infra      </tspan><tspan fill="#6E7681">= [ </tspan><tspan fill="#4ADE80">"docker"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#56D4DD">"kubernetes"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#4ADE80">"github actions"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#56D4DD">"linux"</tspan><tspan fill="#6E7681">, </tspan><tspan fill="#4ADE80">"k6"</tspan><tspan fill="#6E7681"> ]</tspan></text>
<rect x="1" y="37" width="998" height="268" rx="9" fill="url(#scan)" pointer-events="none"/>
</svg>
